services:
  shard-1:
    image: postgres:16
    ports: ["5433:5432"]
    environment:
      - POSTGRES_DB=shard1
      - POSTGRES_USER=user
      - POSTGRES_PASSWORD=password
    volumes: [shard1-data:/var/lib/postgresql/data]
  shard-2:
    image: postgres:16
    ports: ["5434:5432"]
    environment:
      - POSTGRES_DB=shard2
      - POSTGRES_USER=user
      - POSTGRES_PASSWORD=password
    volumes: [shard2-data:/var/lib/postgresql/data]
  shard-3:
    image: postgres:16
    ports: ["5435:5432"]
    environment:
      - POSTGRES_DB=shard3
      - POSTGRES_USER=user
      - POSTGRES_PASSWORD=password
    volumes: [shard3-data:/var/lib/postgresql/data]
  shard-4:
    image: postgres:16
    ports: ["5436:5432"]
    environment:
      - POSTGRES_DB=shard4
      - POSTGRES_USER=user
      - POSTGRES_PASSWORD=password
    volumes: [shard4-data:/var/lib/postgresql/data]

volumes:
  shard1-data:
  shard2-data:
  shard3-data:
  shard4-data:
