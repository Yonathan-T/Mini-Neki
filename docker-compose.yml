services:
  shard-0:
    image: postgres:16
    ports: ["5433:5432"]
    environment:
      - POSTGRES_DB=shard0
      - POSTGRES_USER=user
      - POSTGRES_PASSWORD=password
    volumes: [shard0-data:/var/lib/postgresql/data]
  shard-1:
    image: postgres:16
    ports: ["5434:5432"]
    environment:
      - POSTGRES_DB=shard1
      - POSTGRES_USER=user
      - POSTGRES_PASSWORD=password
    volumes: [shard1-data:/var/lib/postgresql/data]
  shard-2:
    image: postgres:16
    ports: ["5435:5432"]
    environment:
      - POSTGRES_DB=shard2
      - POSTGRES_USER=user
      - POSTGRES_PASSWORD=password
    volumes: [shard2-data:/var/lib/postgresql/data]

volumes:
  shard0-data:
  shard1-data:
  shard2-data:
